<div class="container">
    <form class="todo-form" [formGroup]="formTodo" (ngSubmit)="submitForm()">
        <h1 class="todo-form__title">CREATE TODO FORM</h1>

        <mat-form-field class="todo-form__field">
            <mat-label>Название задачи</mat-label>
            <input matInput type="text" formControlName="title" />
            <mat-error
                *ngIf="(formTodo.controls['title'].invalid && formTodo.controls['title'].dirty) || formTodo.controls['title'].touched">
                Название задачи некорректно
            </mat-error>
        </mat-form-field>

        <mat-form-field class="todo-form__field">
            <mat-label>Автор задачи</mat-label>
            <input matInput type="text" formControlName="userId" />
            <mat-error
                *ngIf="(formTodo.controls['userId'].invalid && formTodo.controls['userId'].dirty) || formTodo.controls['userId'].touched">
                Автор задачи некорректен
            </mat-error>
        </mat-form-field>

        <mat-form-field class="todo-form__field">
            <mat-label>Задача завершена?</mat-label>
            <input matInput type="text" formControlName="completed" placeholder="Да/Нет" />
            <mat-error
                *ngIf="(formTodo.controls['completed'].invalid && formTodo.controls['completed'].dirty) || formTodo.controls['completed'].touched">
                ответ некорректен
            </mat-error>
        </mat-form-field>

        <button class="todo-form__button" type="submit" [disabled]="formTodo.invalid" mat-raised-button color="primary">
            + CREATE TODO
        </button>
    </form>
</div>
