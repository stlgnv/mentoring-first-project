<app-create-todo-form (createTodo)="createTodo($event)"></app-create-todo-form>
<div class="todo-list container">
  <div class="todo-list__items">
    <div class="todo-list__item" *ngFor="let todo of todosService.todos$ | async">
      <app-todo-card [todo]="todo" (deleteTodo)="deleteTodo($event)">
      </app-todo-card>
    </div>
  </div>
</div>
