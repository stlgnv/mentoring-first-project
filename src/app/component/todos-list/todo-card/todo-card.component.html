<div class="todo-card">
  <p class="todo-card__text">ТЕКСТ ЗАДАЧИ:</p>
  <div class="todo-card__title">{{ todo.title }}</div>

  <p class="todo-card__author">АВТОР ЗАДАЧИ:</p>
  <div class="todo-card__id">ID: {{ todo.userId }}</div>

  <p class="todo-card__label">ЗАДАЧА ЗАВЕРШЕНА?:</p>
  <div class="todo-card__status">{{ todo.completed ? 'ДА' : 'НЕТ' }}</div>

  <button class="todo-card__button" (click)="onDeleteTodo(todo.id)">УДАЛИТЬ ЗАДАЧУ</button>
</div>
