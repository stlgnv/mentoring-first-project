<div class="container">
    <form class="user-form" [formGroup]="formUser" (ngSubmit)="submitForm()">
        <h1 class="user-form__title">CREATE USER FORM</h1>

        <mat-form-field class="user-form__field">
            <mat-label>NAME:</mat-label>
            <input matInput type="text" formControlName="name" />
            <mat-error
                *ngIf="(formUser.controls['name'].invalid && formUser.dirty) || formUser.controls['name'].touched">
                Имя введено неправильно
            </mat-error>
        </mat-form-field>

        <mat-form-field class="user-form__field">
            <mat-label>EMAIL:</mat-label>
            <input matInput type="text" formControlName="email" />
            <mat-error
                *ngIf="(formUser.controls['email'].invalid && formUser.controls['email'].dirty) || formUser.controls['email'].touched">
                Эмайл введен неправильно
            </mat-error>
        </mat-form-field>

        <mat-form-field class="user-form__field">
            <mat-label>WEBSITE:</mat-label>
            <input matInput type="text" formControlName="website" />
            <mat-error
                *ngIf="(formUser.controls['website'].invalid && formUser.controls['website'].dirty) || formUser.controls['website'].touched">
                Вебсайт введен неправильно
            </mat-error>
        </mat-form-field>

        <mat-form-field class="user-form__field">
            <mat-label>COMPANY NAME:</mat-label>
            <input matInput type="text" formControlName="companyName" />
            <mat-error
                *ngIf="(formUser.controls['companyName'].invalid && formUser.controls['companyName'].dirty) || formUser.controls['companyName'].touched">
                Имя компаний введено неправильно
            </mat-error>
        </mat-form-field>

        <button class="user-form__button" type="submit" [disabled]="formUser.invalid" mat-raised-button color="primary">
            + CREATE USER
        </button>
    </form>
</div>
