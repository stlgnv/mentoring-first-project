<div class="container">КОМПОНЕНТ СПИСКА ЮЗЕРОВ

    <div class="users">
        <div class="users-list" *ngFor="let item of users">
            <p> {{$any(item).name}}</p>
            <p> {{$any(item).email}}</p>
            <p>{{$any(item).website}}</p>
            <p> {{$any(item).company.name}}</p>
            <button class="users-list__button" (click)="deleteUser(item.id)">delete user</button>
        </div>
    </div></div>
