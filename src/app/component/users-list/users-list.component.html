<div class="container">КОМПОНЕНТ СПИСКА ЮЗЕРОВ

    <div class="users">
        <div class="users-list" *ngFor="let user of users">
            <p> {{user.name}}</p>
            <p> {{user.email}}</p>
            <p>{{user.website}}</p>
            <p> {{user.company.name}}</p>
            <button class="users-list__button" (click)="deleteUser(user.id)">delete user</button>
        </div>
    </div></div>
