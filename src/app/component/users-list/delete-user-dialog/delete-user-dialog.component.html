<mat-dialog-content>
    <h2 mat-dialog-title>Delete user: {{ this.data.user.name }}</h2>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-dialog-close mat-raised-button matTooltip="Отмена удаления">Cancel</button>
    <button matButton cdkFocusInitial mat-raised-button color="primary" matTooltip="Удалить пользователя навсегда"
        [mat-dialog-close]="true">Delete</button>
</mat-dialog-actions>
